<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>diag</title></head>
<body>
<pre id="diag">running...</pre>
<iframe id="f" src="index.html" style="width:100%;height:900px;border:0"></iframe>
<script>
function report(label, w) {
  var d = document.getElementById('f').contentDocument;
  var win = document.getElementById('f').contentWindow;
  var img = d.querySelector('.hero-photo img');
  var box = d.querySelector('.hero-photo');
  var grid = d.querySelector('.hero-grid');
  var cs = win.getComputedStyle(img);
  var cb = box.getBoundingClientRect();
  var ci = img.getBoundingClientRect();
  var out = [
    '=== ' + label + ' (viewport ' + w + 'px) ===',
    '  .hero-grid  rect: ' + JSON.stringify(grid.getBoundingClientRect().toJSON()),
    '  .hero-photo rect: x=' + cb.x.toFixed(1) + ' y=' + cb.y.toFixed(1) +
      ' w=' + cb.width.toFixed(1) + ' h=' + cb.height.toFixed(1) +
      '  scrollW=' + box.scrollWidth + ' scrollH=' + box.scrollHeight,
    '  img rect:      x=' + ci.x.toFixed(1) + ' y=' + ci.y.toFixed(1) +
      ' w=' + ci.width.toFixed(1) + ' h=' + ci.height.toFixed(1),
    '  img computed:  width=' + cs.width + ' height=' + cs.height +
      ' object-fit=' + cs.objectFit + ' object-position=' + cs.objectPosition +
      ' aspect-ratio=' + cs.aspectRatio + ' max-width=' + cs.maxWidth,
    '  natural:       ' + img.naturalWidth + 'x' + img.naturalHeight,
    '  box overflow:  ' + win.getComputedStyle(box).overflow +
      '   transform=' + win.getComputedStyle(box).transform,
    '  page scrollW:  ' + d.documentElement.scrollWidth +
      '  clientW=' + d.documentElement.clientWidth +
      '   (horizontal overflow = ' + (d.documentElement.scrollWidth > d.documentElement.clientWidth) + ')',
    '  grid cols:     ' + win.getComputedStyle(grid).gridTemplateColumns,
    ''
  ].join('\n');
  document.getElementById('diag').textContent += out;
}

var widths = [1440, 1280, 1024, 900, 768, 640, 390];
var i = 0;
var f = document.getElementById('f');

function step() {
  if (i >= widths.length) { document.getElementById('diag').textContent += 'DONE'; return; }
  var w = widths[i++];
  f.style.width = w + 'px';
  setTimeout(function () {
    try { report('width', w); } catch (e) { document.getElementById('diag').textContent += 'ERR ' + e + '\n'; }
    step();
  }, 350);
}
f.addEventListener('load', function () { setTimeout(step, 400); });
</script>
</body>
</html>
